version: 2

sources:
  - name: raw
    database: raw
    tables:
      - name: forecasts
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 3, period: hour}
        columns:
          - name: city_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'cities')
                    field: id
          - name: forecast_made_at
            tests: [not_null]
          - name: target_time
            tests: [not_null]

      - name: actuals
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 2, period: hour}
        columns:
          - name: city_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'cities')
                    field: id
          - name: observed_at
            tests: [not_null]

      - name: cities
        columns:
          - name: id
            tests: [not_null, unique]